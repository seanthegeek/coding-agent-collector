[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-analyzer"
version = "0.9.0"
description = "Analyst-side parser for coding-agent-collector output: detects AI coding agent state and builds a JSONL timeline"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["zstandard", "python-dateutil"]

[project.scripts]
analyze-agent-artifacts = "agent_analyzer.cli:main"

[tool.setuptools]
packages = ["agent_analyzer", "agent_analyzer.parsers"]

[tool.setuptools.package-data]
agent_analyzer = ["catalog.txt"]

# The rule set lives in the repository root's ruff.toml so analyzer/,
# analyzer/tools/ and tools/ share it; this makes ruff run from inside
# analyzer/ pick up the same settings instead of any user-level config.
[tool.ruff]
extend = "../ruff.toml"
