[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-analyzer"
version = "0.5.0"
description = "Analyst-side parser for coding-agent-collector output: detects AI coding agent state and builds a CSV timeline"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["zstandard"]

[project.scripts]
analyze-agent-artifacts = "agent_analyzer.cli:main"

[tool.setuptools]
packages = ["agent_analyzer", "agent_analyzer.parsers"]

[tool.setuptools.package-data]
agent_analyzer = ["catalog.txt"]
