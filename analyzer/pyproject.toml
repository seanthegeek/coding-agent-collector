[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "doubleagent"
dynamic = ["version"]
description = "Forensic analyzer of AI agent use on a system: detects agent state and builds a JSONL timeline from the agents' transcripts"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["zstandard", "python-dateutil"]

[project.scripts]
doubleagent = "doubleagent.cli:main"

[tool.setuptools]
packages = ["doubleagent", "doubleagent.parsers"]

[tool.setuptools.dynamic]
version = { attr = "doubleagent.VERSION" }

[tool.setuptools.package-data]
doubleagent = ["catalog.txt"]

# The rule set lives in the repository root's ruff.toml so analyzer/,
# analyzer/tools/ and tools/ share it; this makes ruff run from inside
# analyzer/ pick up the same settings instead of any user-level config.
[tool.ruff]
extend = "../ruff.toml"
